<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL 탐정단 | 1차시 형성평가</title><style>
:root{--navy:#162958;--ink:#17223d;--purple:#6247bd;--yellow:#ffe06e;--bg:#eef5ff;--line:#d6e0f2;--green:#16734b;--red:#b12c43}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf5ff,#f7f3ff);font:17px/1.6 system-ui,'Malgun Gothic',sans-serif;color:var(--ink)}header{background:linear-gradient(105deg,#13265b,#38499d);color:white;padding:27px 18px 35px}header .wrap{max-width:920px;margin:auto}.kicker{font-size:.88rem;color:#ffe06e;font-weight:800;letter-spacing:.1em}h1{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.28;margin:8px 0}header p{margin:4px 0;color:#eaf0ff}.wrap{max-width:920px;margin:0 auto;padding:0 16px}main{padding:24px 0 64px}.intro,.question-card,.result{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 6px 18px #16356712;margin-bottom:18px}.intro{display:grid;grid-template-columns:1fr 1fr;gap:12px}.intro>div:first-child{grid-column:span 2}.intro label{display:block;font-weight:750;font-size:.9rem;margin-bottom:3px}input[type=text]{display:block;width:100%;font:inherit;padding:11px 13px;border:1.5px solid #b5c4e3;border-radius:10px}.small{font-size:.86rem;color:#52607c}.question-card{scroll-margin-top:20px}.qhead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}.num{background:#172e6e;color:white;padding:3px 11px;border-radius:9px;font-weight:800}.unit{background:#f0eaff;color:#56349b;border-radius:30px;padding:3px 12px;font-size:.85rem;font-weight:750}.points{margin-left:auto;color:#52607c;font-size:.83rem}h2{font-size:1.2rem;line-height:1.55;margin:5px 0 17px;white-space:pre-line}label.option{display:flex;gap:11px;padding:12px 13px;margin:8px 0;background:#f8faff;border:1.5px solid #e2e8f6;border-radius:11px;cursor:pointer}label.option:has(input:checked){border-color:#5e65cd;background:#eef0ff}label.option input{accent-color:#514ca9;transform:scale(1.18);align-self:flex-start;margin-top:7px}.feedback{border-left:4px solid #7381ad;margin-top:13px;padding:10px 14px;background:#f7f9ff;border-radius:7px}.correct{border-color:#1b895b}.incorrect{border-color:#c43e59}.actions{position:sticky;bottom:0;z-index:10;background:#fffefdec;border-top:1px solid var(--line);padding:12px 0;backdrop-filter:blur(7px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:920px;margin:auto;padding:0 16px;flex-wrap:wrap}button{border:none;border-radius:10px;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}button.primary{background:#303a91;color:white}button.secondary{background:#e7eafa;color:#233071}.result{border:2px solid #cfd4f8}.score{font-size:2.4rem;font-weight:900;color:#283797}.hidden{display:none}.tag{display:inline-block;color:#1d6948;background:#e3f6ec;border-radius:12px;padding:1px 8px;font-size:.83rem}@media(max-width:680px){.intro{grid-template-columns:1fr}.intro>div:first-child{grid-column:auto}.question-card{padding:17px}.bar button{flex:1}header{padding-top:23px}}@media print{header,.intro,.actions,.small,button{display:none!important}body{background:white;font-size:12px}.question-card{break-inside:avoid;box-shadow:none;padding:12px;margin:10px 0}.result{display:block}label.option{padding:5px}.feedback{padding:5px}}
</style></head><body><header><div class="wrap"><div class="kicker">안산공업고등학교 컴퓨터과 | 데이터 베이스 프로그래밍</div><h1>🔎 SQL 탐정단<br>뒤바뀐 무선이어폰 택배</h1><p>1차시 형성평가 · 15문항 · 100점 만점</p></div></header><main class="wrap"><section class="intro"><div><strong>📋 탐정 임무 안내</strong><div class="small">정답을 하나씩 선택하고 마지막에 채점하세요. SQL 기초 개념과 택배 기록 조회 능력을 확인합니다. 이름과 학번은 이 기기에만 표시되며 서버로 전송되지 않습니다.</div></div><div><label for="student">학생 이름 (선택)</label><input id="student" type="text" placeholder="이름 입력" maxlength="30"></div><div><label for="studentId">학번 (선택)</label><input id="studentId" type="text" placeholder="예: 30101" maxlength="20"></div></section><div id="questions"></div><section id="result" class="result hidden" aria-live="polite"></section></main><div class="actions"><div class="bar"><span id="progress" class="small">응답 0 / 15</span><div style="display:flex;gap:9px"><button id="reset" class="secondary" type="button">다시 풀기</button><button id="grade" class="primary" type="button">채점하고 해설 보기</button><button id="download" class="secondary hidden" type="button">결과 CSV 저장</button></div></div></div><script>
const Q=[{"unit": "기초", "question": "데이터베이스(DB)의 설명으로 알맞은 것은?", "options": ["여러 데이터를 체계적으로 저장하고 관리하는 곳", "그림만 편집하는 프로그램", "인터넷 연결 속도를 측정하는 도구", "문서를 종이에 인쇄하는 기계"], "answer": 0, "explain": "데이터베이스는 데이터를 저장하고 관리하며, SQL을 이용해 필요한 데이터를 조회할 수 있습니다.", "points": 6}, {"unit": "기초", "question": "택배 기록표 parcels에서 행(row) 하나는 무엇을 나타낼까요?", "options": ["물품의 종류 전체", "택배 한 건의 기록", "모든 택배의 무게 합계", "SQL 문법 한 가지"], "answer": 1, "explain": "한 행은 하나의 택배 기록이고, 열(column)은 택배번호·물품·무게처럼 정보의 종류를 나타냅니다.", "points": 6}, {"unit": "기초", "question": "SQL에서 보고 싶은 열을 정하는 명령어는?", "options": ["WHERE", "ORDER BY", "SELECT", "AND"], "answer": 2, "explain": "SELECT는 조회할 열을 지정합니다.", "points": 6}, {"unit": "기초", "question": "SQL에서 데이터를 조회할 테이블을 지정하는 명령어는?", "options": ["FROM", "ASC", "AND", "WHERE"], "answer": 0, "explain": "FROM은 조회 대상 테이블을 정합니다.", "points": 6}, {"unit": "기초", "question": "parcels 테이블의 모든 열을 조회하려면?", "options": ["SELECT ALL FROM parcels;", "SELECT * FROM parcels;", "FROM parcels SELECT;", "WHERE * FROM parcels;"], "answer": 1, "explain": "SELECT * FROM parcels;에서 *는 모든 열을 뜻합니다.", "points": 6}, {"unit": "응용", "question": "다음 SQL이 조회하는 택배는?\nSELECT parcel_id, item FROM parcels WHERE zone = 'C';", "options": ["모든 구역의 택배", "C구역의 택배", "무게가 C인 택배", "C라는 이름의 테이블"], "answer": 1, "explain": "WHERE zone = 'C'는 zone 열의 값이 C인 행을 선택합니다.", "points": 7}, {"unit": "응용", "question": "포장 무게가 정확히 200g일 때, 참인 조건은?", "options": ["weight_g > 200", "weight_g < 200", "weight_g >= 200", "weight_g = 201"], "answer": 2, "explain": "이상(>=)은 경계값인 200을 포함합니다.", "points": 7}, {"unit": "응용", "question": "포장 무게가 200g 이하인 택배를 찾는 조건은?", "options": ["weight_g < 200", "weight_g <= 200", "weight_g >= 200", "weight_g > 200"], "answer": 1, "explain": "이하(<=)는 200g을 포함합니다.", "points": 7}, {"unit": "응용", "question": "무게가 100g 이상이면서 800g 이하인 조건은?", "options": ["weight_g >= 100 AND weight_g <= 800", "weight_g > 100 AND weight_g > 800", "weight_g = 100 AND weight_g = 800", "weight_g <= 100 AND weight_g >= 800"], "answer": 0, "explain": "AND는 두 조건을 모두 만족하는 행을 찾습니다.", "points": 7}, {"unit": "응용", "question": "택배 무게가 가벼운 순서대로 정렬하려면?", "options": ["ORDER BY weight_g DESC", "ORDER BY weight_g ASC", "WHERE weight_g ASC", "FROM weight_g ASC"], "answer": 1, "explain": "ORDER BY weight_g ASC는 오름차순(작은 값부터) 정렬합니다.", "points": 7}, {"unit": "분석", "question": "다음 중 WHERE와 AND를 함께 쓰는 이유는?", "options": ["테이블 이름을 바꾸기 위해", "열 이름을 삭제하기 위해", "여러 조건을 모두 만족하는 행만 조회하기 위해", "조회 결과를 무조건 한 행으로 만들기 위해"], "answer": 2, "explain": "AND는 개별 조건들을 함께 적용하여 후보를 좁힙니다.", "points": 7}, {"unit": "분석", "question": "item이 무선이어폰이고 status가 보관중인 기록만 조회하려면?", "options": ["WHERE item = '무선이어폰' AND status = '보관중'", "WHERE item = '무선이어폰' ORDER BY status", "FROM item = '무선이어폰' AND status = '보관중'", "WHERE item = '무선이어폰' OR status = '보관중'"], "answer": 0, "explain": "두 조건을 모두 충족시키려면 AND를 사용합니다.", "points": 7}, {"unit": "분석", "question": "SQL에서 문자열 C를 조건에 사용할 때 올바른 표기는?", "options": ["zone = C", "zone = \"\"", "zone = 'C'", "zone = #C"], "answer": 2, "explain": "문자열 리터럴은 작은따옴표로 감싸며, zone = 'C'처럼 작성합니다.", "points": 7}, {"unit": "분석", "question": "ORDER BY 없이 조회할 때 결과 행의 순서에 대한 설명으로 알맞은 것은?", "options": ["항상 입력한 순서대로 나온다", "항상 택배번호 순서로 나온다", "항상 최신 택배부터 나온다", "특정한 행 순서가 보장되지 않는다"], "answer": 3, "explain": "정해진 순서가 필요하면 ORDER BY를 명시해야 합니다.", "points": 7}, {"unit": "분석", "question": "SQL 조회만으로 뒤바뀐 무선이어폰 택배의 소유자와 실제 바꿔치기 여부를 확정할 수 있나요?", "options": ["가능하다. 조건이 맞으면 고의도 확정된다", "불가능하다. 후보만 좁히고 주문내역과 실제 물건 등을 추가 확인해야 한다", "가능하다. ORDER BY가 정답을 확정한다", "가능하다. 자동채점 점수가 높으면 사실이다"], "answer": 1, "explain": "SQL 조회 결과는 조건에 맞는 후보를 알려 줍니다. 실제 물품과 소유자, 고의 여부는 별도의 확인이 필요합니다.", "points": 7}];
const letters=['①','②','③','④'];let graded=false;let finalScore=0;
const qs=document.getElementById('questions'),res=document.getElementById('result');
const escapeHtml=(str)=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
Q.forEach((q,i)=>{const sec=document.createElement('section');sec.className='question-card';sec.id='q'+i;sec.innerHTML=`<div class="qhead"><span class="num">Q${i+1}</span><span class="unit">${escapeHtml(q.unit)}</span><span class="points">${q.points}점</span></div><h2>${escapeHtml(q.question)}</h2><div class="choices">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${letters[j]} ${escapeHtml(o)}</span></label>`).join('')}</div><div class="feedback hidden"></div>`;qs.appendChild(sec)});
function answers(){return Q.map((q,i)=>{const t=document.querySelector(`input[name="q${i}"]:checked`);return t?Number(t.value):null})}
function update(){document.getElementById('progress').textContent=`응답 ${answers().filter(x=>x!==null).length} / ${Q.length}`}
qs.addEventListener('change',()=>{if(!graded)update()});
document.getElementById('grade').addEventListener('click',()=>{const a=answers(),missing=a.filter(v=>v===null).length;if(missing&&!window.confirm(`아직 ${missing}문제를 풀지 않았습니다. 미응답은 0점 처리하고 채점할까요?`))return;graded=true;finalScore=0;Q.forEach((q,i)=>{if(a[i]===q.answer)finalScore+=q.points;const s=document.getElementById('q'+i),f=s.querySelector('.feedback');f.classList.remove('hidden');const good=a[i]===q.answer;f.className='feedback '+(good?'correct':'incorrect');f.innerHTML=`<strong>${good?'정답입니다 ✓':'오답입니다'}</strong> · 정답: ${letters[q.answer]} ${escapeHtml(q.options[q.answer])}<div>${escapeHtml(q.explain)}</div>`;s.querySelectorAll('input').forEach(inp=>inp.disabled=true)});const name=document.getElementById('student').value.trim(),id=document.getElementById('studentId').value.trim();res.classList.remove('hidden');res.innerHTML=`<h2>🕵️ 수사 결과 확인</h2><div class="small">${escapeHtml(name||'학생')}${id?' · '+escapeHtml(id):''}</div><div class="score">${finalScore} / 100점</div><div>정답 ${Q.filter((q,i)=>a[i]===q.answer).length}개 / 총 ${Q.length}문항</div><p>각 문항 아래에서 정답과 해설을 확인하고 틀린 SQL 개념을 다시 복습하세요.</p><p class="tag">점수는 자동으로 교사에게 제출되지 않습니다.</p>`;document.getElementById('download').classList.remove('hidden');document.getElementById('grade').disabled=true;res.scrollIntoView({behavior:'smooth',block:'start'})});
document.getElementById('reset').addEventListener('click',()=>{if(!window.confirm('현재 답안과 점수를 지우고 처음부터 다시 풀까요?'))return;graded=false;finalScore=0;qs.querySelectorAll('input').forEach(el=>el.disabled=false);document.querySelectorAll('input[type=radio]').forEach(el=>el.checked=false);document.querySelectorAll('.feedback').forEach(el=>{el.className='feedback hidden';el.innerHTML=''});res.classList.add('hidden');document.getElementById('download').classList.add('hidden');document.getElementById('grade').disabled=false;update();scrollTo({top:0,behavior:'smooth'})});
document.getElementById('download').addEventListener('click',()=>{const now=new Date();const name=document.getElementById('student').value.trim()||'미기재';const id=document.getElementById('studentId').value.trim()||'미기재';const data=[['응시일시','학번','이름','점수','정답수',...Q.map((_,i)=>'Q'+(i+1))],[now.toLocaleString('ko-KR'),id,name,finalScore,Q.filter((q,i)=>answers()[i]===q.answer).length,...answers().map((v,i)=>v===null?'미응답':letters[v])]];const csv='\ufeff'+data.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`SQL탐정단_형성평가_${id.replace(/[^a-zA-Z0-9가-힣_-]/g,'_')}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)});
update();
</script></body></html>
